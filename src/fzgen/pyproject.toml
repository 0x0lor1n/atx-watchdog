[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "fzgen"
version = "0.1.0"
description = "Fritzing breadboard sketches from code, linted against what Fritzing draws"
license = "MIT"
requires-python = ">=3.11"

[project.scripts]
fzgen-lint = "fzgen.lint:cli"

[tool.setuptools.package-data]
fzgen = ["vendor/*"]
